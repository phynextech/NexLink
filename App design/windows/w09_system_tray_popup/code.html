<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexLink System Tray</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Rajdhani:wght@400;500;600;700&amp;family=Nunito:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-blur {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .cyan-glow {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }
    .cyan-glow-active {
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.2);
      border-radius: 999px;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary": "#2f3131",
            "inverse-surface": "#dfe2f3",
            "tertiary": "#ececec",
            "on-primary-fixed-variant": "#004f58",
            "error": "#ffb4ab",
            "surface-container-highest": "#313442",
            "primary-fixed": "#9cf0ff",
            "on-error-container": "#ffdad6",
            "on-secondary-container": "#c0acff",
            "primary-container": "#00e5ff",
            "tertiary-fixed-dim": "#c6c6c7",
            "surface-container-lowest": "#0a0e1a",
            "on-tertiary-fixed-variant": "#454747",
            "surface-container-low": "#171b28",
            "tertiary-fixed": "#e2e2e2",
            "primary-fixed-dim": "#00daf3",
            "surface-container-high": "#262a37",
            "surface": "#0f131f",
            "surface-container": "#1b1f2c",
            "on-surface-variant": "#bac9cc",
            "surface-bright": "#353946",
            "outline-variant": "#3b494c",
            "surface-tint": "#00daf3",
            "surface-dim": "#0f131f",
            "background": "#0f131f",
            "on-error": "#690005",
            "secondary-fixed": "#e8deff",
            "on-primary-fixed": "#001f24",
            "inverse-primary": "#006875",
            "secondary": "#cdbdff",
            "primary": "#c3f5ff",
            "on-tertiary-container": "#575959",
            "on-secondary": "#370096",
            "error-container": "#93000a",
            "surface-variant": "#313442",
            "tertiary-container": "#d0d0d0",
            "on-tertiary-fixed": "#1a1c1c",
            "on-surface": "#dfe2f3",
            "secondary-fixed-dim": "#cdbdff",
            "on-secondary-fixed": "#20005f",
            "on-background": "#dfe2f3",
            "outline": "#849396",
            "on-secondary-fixed-variant": "#4f00d0",
            "secondary-container": "#5203d5",
            "on-primary-container": "#00626e",
            "on-primary": "#00363d",
            "inverse-on-surface": "#2c303d"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "fontFamily": {
            "body-md": ["Nunito"],
            "body-lg": ["Nunito"],
            "label-caps": ["Rajdhani"],
            "h2": ["Rajdhani"],
            "h3": ["Rajdhani"],
            "h1": ["Rajdhani"],
            "data-mono": ["JetBrains Mono"]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-xl font-body-md text-on-surface">
<!-- System Tray Popup (Mini Widget) -->
<div class="relative w-[320px] h-[480px] bg-[#0D1220]/90 glass-blur rounded-xl border border-white/10 shadow-[0_24px_48px_rgba(0,0,0,0.6)] flex flex-col overflow-hidden">
<!-- TopAppBar Identity -->
<header class="h-[48px] w-full flex items-center justify-between px-4 border-b border-white/10 bg-[#0D1220]">
<div class="flex items-center gap-2">
<span class="text-lg font-bold text-white uppercase tracking-widest font-['Space_Grotesk']">NexLink</span>
</div>
<div class="flex items-center gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-[#00E5FF] animate-pulse"></div>
<span class="font-data-mono text-[10px] text-[#00E5FF] tracking-wider uppercase">Connected</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-400 text-[18px] hover:text-white transition-colors cursor-pointer">settings</span>
<span class="material-symbols-outlined text-slate-400 text-[18px] hover:text-white transition-colors cursor-pointer">close</span>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 p-4 flex flex-col gap-4 overflow-y-auto">
<!-- Quick Stats Bento Grid -->
<div class="grid grid-cols-2 gap-2">
<!-- Battery -->
<div class="bg-[#121929]/60 glass-blur p-3 rounded-lg border border-white/5 hover:border-[#00E5FF]/30 transition-all group">
<div class="flex items-center justify-between mb-1">
<span class="material-symbols-outlined text-[#00E5FF] text-[18px]">battery_horiz_075</span>
<span class="font-data-mono text-[11px] text-slate-400">78%</span>
</div>
<p class="font-label-caps text-[10px] text-slate-500 uppercase">Power Status</p>
</div>
<!-- Wi-Fi -->
<div class="bg-[#121929]/60 glass-blur p-3 rounded-lg border border-white/5 hover:border-[#00E5FF]/30 transition-all">
<div class="flex items-center justify-between mb-1">
<span class="material-symbols-outlined text-[#00E5FF] text-[18px]">wifi</span>
<span class="font-data-mono text-[11px] text-slate-400 truncate ml-2">HomeNet</span>
</div>
<p class="font-label-caps text-[10px] text-slate-500 uppercase">Wireless</p>
</div>
<!-- Bluetooth -->
<div class="bg-[#121929]/60 glass-blur p-3 rounded-lg border border-white/5 hover:border-[#00E5FF]/30 transition-all">
<div class="flex items-center justify-between mb-1">
<span class="material-symbols-outlined text-[#00E5FF] text-[18px]">bluetooth</span>
<span class="font-data-mono text-[11px] text-slate-400">2 Active</span>
</div>
<p class="font-label-caps text-[10px] text-slate-500 uppercase">Peripherals</p>
</div>
<!-- Sync Status -->
<div class="bg-[#121929]/60 glass-blur p-3 rounded-lg border border-white/5 hover:border-[#00E5FF]/30 transition-all">
<div class="flex items-center justify-between mb-1">
<span class="material-symbols-outlined text-[#00E5FF] text-[18px]">sync</span>
<span class="material-symbols-outlined text-[#00E5FF] text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="font-label-caps text-[10px] text-slate-500 uppercase">Sync Active</p>
</div>
</div>
<!-- Sliders Section -->
<div class="flex flex-col gap-3">
<!-- Brightness -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-400 text-[16px]">wb_sunny</span>
<span class="font-label-caps text-[10px] text-slate-400 uppercase tracking-wider">Brightness</span>
</div>
<span class="font-data-mono text-[10px] text-[#00E5FF]">65%</span>
</div>
<div class="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
<div class="h-full w-[65%] bg-gradient-to-r from-[#00E5FF] to-secondary-container rounded-full relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full border-2 border-[#00E5FF] shadow-[0_0_8px_rgba(0,229,255,0.5)]"></div>
</div>
</div>
</div>
<!-- Volume -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-400 text-[16px]">volume_up</span>
<span class="font-label-caps text-[10px] text-slate-400 uppercase tracking-wider">Volume</span>
</div>
<span class="font-data-mono text-[10px] text-[#00E5FF]">42%</span>
</div>
<div class="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
<div class="h-full w-[42%] bg-gradient-to-r from-[#00E5FF] to-secondary-container rounded-full relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full border-2 border-[#00E5FF] shadow-[0_0_8px_rgba(0,229,255,0.5)]"></div>
</div>
</div>
</div>
</div>
<!-- Recent Notification Card -->
<div class="flex flex-col gap-2 mt-2">
<h4 class="font-label-caps text-[10px] text-slate-500 uppercase tracking-widest px-1">Recent Activity</h4>
<div class="bg-[#1A2236] p-3 rounded-lg border border-white/10 flex gap-3 items-start cyan-glow">
<img alt="Sarah J." class="w-8 h-8 rounded-full border border-[#00E5FF]/20 object-cover" data-alt="Close up portrait of a professional woman in tech with neutral expression, soft studio lighting and dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNrwm_dWBq-Me14ovGqYi8XtwYHsNOyVlWE7D_VYiossfKmW3aiMpcBmtcJi5ChlKE2GdqHD7cCrSfBWxZVv0pS7ip6I9-fbpD8WbdtzAk6ts1kFZvMZF32j-oWT3oA6ThZMCP7RV8VsvI230p9EklHGiPyK4S1PDxzFKg44NZJySkuPtPwQDgsaRQr7KV5jhsy18aX-Ar5JXzZFVDEI6pjviH9TeBqoQNBCb7W2CJO71-Od7s_1B0FkUnToBwV_4Z6YoHLLo834nX"/>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-bold text-white text-[12px]">Sarah Jenkins</span>
<span class="font-data-mono text-[9px] text-slate-500 uppercase">2m ago</span>
</div>
<p class="text-slate-400 text-[11px] leading-tight line-clamp-2 mt-0.5">Shared "Q4_Performance_Sync.pdf" via clipboard sync.</p>
</div>
</div>
</div>
</main>
<!-- Bottom Icon Actions -->
<footer class="h-[56px] border-t border-white/5 bg-[#0D1220]/50 px-4 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/5 text-slate-400 hover:text-[#00E5FF] transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]">airplanemode_active</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/5 text-slate-400 hover:text-[#00E5FF] transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]">nights_stay</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/5 text-slate-400 hover:text-[#00E5FF] transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]">screen_share</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg bg-gradient-to-tr from-secondary-container to-primary-container text-white cyan-glow-active transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</button>
</footer>
<!-- Decorative background glow -->
<div class="absolute -bottom-12 -right-12 w-32 h-32 bg-[#00E5FF] opacity-10 blur-[64px] pointer-events-none"></div>
<div class="absolute -top-12 -left-12 w-32 h-32 bg-secondary-container opacity-10 blur-[64px] pointer-events-none"></div>
</div>
</body></html>
