<span class="material-symbols-outlined text-[80px] text-[#FF4D6A] neon-glow-red relative block" data-icon="link_off">link_off</span>

            </p>

<button class="w-full py-2 text-cyan-400 font-medium hover:text-cyan-300 transition-colors text-[14px] active:scale-95">
