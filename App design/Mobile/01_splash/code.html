<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexLink - Your PC. Anywhere.</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&amp;family=Space+Grotesk:wght@500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .mesh-grid {
            background-image: radial-gradient(circle at 1px 1px, rgba(0, 229, 255, 0.15) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .glow-node {
            filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.8));
        }
        .progress-glow {
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
    </style>

            darkMode: "class",

                extend: {
                    "colors": {
                        "error-container": "#93000a",
                        "secondary-fixed-dim": "#cdbdff",

                        "on-tertiary-fixed": "#171b28",
                        "on-primary-container": "#00626e",
                        "on-surface": "#d9e3f7",
                        "surface-container-low": "#121c2a",
                        "outline": "#849396",
                        "error": "#ffb4ab",
                        "outline-variant": "#3b494c",
                        "tertiary-fixed-dim": "#c3c6d7",
                        "on-surface-variant": "#bac9cc",
                        "tertiary": "#eaecfe",
                        "surface": "#091421",
                        "surface-container": "#16202e",
                        "secondary": "#cdbdff",
                        "surface-container-highest": "#2b3544",
                        "inverse-primary": "#006875",
                        "primary": "#c3f5ff",
                        "on-background": "#d9e3f7",
                        "on-primary": "#00363d",
                        "secondary-fixed": "#e8deff",
                        "tertiary-container": "#cdd0e1",
                        "surface-tint": "#00daf3",
                        "primary-fixed-dim": "#00daf3",
                        "on-error-container": "#ffdad6",
                        "on-tertiary": "#2c303d",
                        "inverse-surface": "#d9e3f7",
                        "on-secondary-fixed": "#20005f",
                        "on-primary-fixed": "#001f24",
                        "on-secondary": "#370096",
                        "primary-container": "#00e5ff",
                        "primary-fixed": "#9cf0ff",
                        "on-secondary-container": "#c0acff",
                        "on-error": "#690005",
                        "inverse-on-surface": "#273140",
                        "on-tertiary-fixed-variant": "#434654",
                        "surface-container-lowest": "#050f1c",
                        "on-primary-fixed-variant": "#004f58",
                        "surface-bright": "#303a49",
                        "secondary-container": "#5203d5",
                        "surface-container-high": "#212a39",
                        "surface-dim": "#091421",
                        "on-tertiary-container": "#555967",
                        "background": "#091421",
                        "surface-variant": "#2b3544",
                        "tertiary-fixed": "#dfe2f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "xl": "64px",
                        "gutter": "16px",
                        "xs": "4px",
                        "sm": "12px",
                        "margin-safe": "24px",
                        "lg": "40px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "h2": ["Space Grotesk"],

                    "fontSize": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-dim text-on-surface font-body-md overflow-hidden antialiased">
<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-center mesh-grid">
<!-- Decorative Radial Glows (Brand Aura) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary-container/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Center Content Stack -->
<div class="z-10 flex flex-col items-center">
<!-- Logo Section: Glowing Node Network forming "N" -->
<div class="relative w-[120px] h-[120px] flex items-center justify-center mb-md">
<div class="absolute inset-0 glow-node opacity-80">
<svg class="w-full h-full text-primary-container" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<circle cx="20" cy="20" fill="currentColor" r="3"></circle>
<circle cx="20" cy="80" fill="currentColor" r="3"></circle>
<circle cx="80" cy="20" fill="currentColor" r="3"></circle>
<circle cx="80" cy="80" fill="currentColor" r="3"></circle>
<path d="M20 80V20L80 80V20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
<!-- Connected Nodes -->
<line class="opacity-40" stroke="currentColor" stroke-dasharray="4 4" stroke-width="2" x1="20" x2="80" y1="20" y2="80"></line>
</svg>
</div>
</div>
<!-- Brand Typography -->
<h1 class="font-h1 text-h1 text-on-surface mb-xs tracking-tight">
                NexLink
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">
                Your PC. Anywhere.
            </p>
</div>
<!-- Bottom Loading & Info Section -->
<div class="absolute bottom-16 w-full flex flex-col items-center px-margin-safe max-w-md">
<!-- Progress Bar Container -->
<div class="w-full h-[3px] bg-surface-container-highest rounded-full overflow-hidden mb-sm">
<!-- Progress Indicator -->
<div class="h-full bg-primary-container progress-glow rounded-full" style="width: 65%;"></div>
</div>
<!-- Status Indicator -->
<div class="flex items-center gap-xs mb-lg">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest">
                    Initializing Link
                </span>
</div>
<!-- Version Tag -->
<span class="font-label-sm text-label-sm text-on-tertiary-container/40">
                v1.0.0
            </span>
</div>
<!-- Decorative Foreground Asset (Abstract UI Hint) -->
<div class="absolute -bottom-24 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-gradient-to-t from-primary-container/10 to-transparent rounded-t-[200px] blur-[80px] pointer-events-none opacity-30"></div>
</main>
<!-- Semantic Hidden Navigation (Suppressing Shell as per instruction for Splash screens) -->
<!-- Navigation is intentionally omitted for Splash Screen focus journey -->
</body></html>
