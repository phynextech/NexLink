    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background min-h-screen text-on-surface font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Anchor -->
<header class="bg-slate-950/60 backdrop-blur-xl border-b border-white/10 fixed top-0 left-0 w-full z-50 flex justify-between items-center w-full px-6 py-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-cyan-400 text-2xl" data-icon="sensors">sensors</span>
<span class="text-xl font-black text-cyan-400 drop-shadow-[0_0_8px_rgba(0,229,255,0.8)] font-['Space_Grotesk'] tracking-tight">NexLink</span>
</div>
<div class="flex items-center gap-4">
<button class="text-slate-400 hover:text-cyan-300 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
<div class="w-8 h-8 rounded-full border border-cyan-400/30 overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="minimalist 3d avatar of a tech-savvy user with glasses and neon blue accents on dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuABTaMDy6zkk5ojQrwhRnC439yNGz8fMIJPLad9QksTFp2u4aqW4rofSIwtKF3BQs1m2PqVn8CLx0Ffn1Z_v9Ouyc4sLuNAolWq9bYIw7Y3K8pIFLcKlXo7n42PprWQWU3ay9ZUgsO4sir2FDES5MpW3KdHIvKIWYn1aOt4RH9EypMdQcHP9EwtbDTXuwycV5ghp1wFjmhbt7mv_oLixcPaMRm1swjs8oYMPJ8M4Lh6O13c05mfoncOMT8Lyt4jBQiGCvDE_kZ090OO"/>
</div>
</div>
</header>
<main class="relative pt-24 pb-32 px-margin-safe min-h-screen flex flex-col items-center">
<!-- Radial Glow Background -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-500/10 rounded-full blur-[120px]"></div>
</div>
<!-- Connection Card -->
<div class="relative z-10 w-full max-w-[340px] h-[380px] bg-slate-950/60 backdrop-blur-[20px] border border-white/10 rounded-3xl p-6 flex flex-col items-center shadow-2xl">
<h2 class="font-['Rajdhani'] font-bold text-[22px] text-white tracking-wide mb-1">Scan to Connect</h2>
<p class="font-['Nunito'] text-[13px] text-[#8892A4] mb-6 text-center">Open NexLink on your PC and scan the QR code</p>
<!-- QR Viewfinder -->
<div class="relative w-[240px] h-[240px] flex items-center justify-center">
<!-- Camera Feed Mockup -->
<div class="absolute inset-0 bg-slate-900 rounded-lg overflow-hidden">
<img class="w-full h-full object-cover opacity-40 grayscale" data-alt="close-up of a blurred desktop monitor showing a digital interface with technical blueprints in cold cyan lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2Y23UNKSg7XJoR0THNV3bFRCQgisQgdr1fxmo-wav1emSkejvilnb0_bXIZjlQZHHX0pO0zfSYx43KOycwGTcRom0RzgazmB_97RQUh65gN6IORKHY2aeGfmO_jGtmG4vnO5JfupS29U8RDSK9dI6rNCgK_KqghFt_s3Fh5MAfai9xx9b2Q2pts8noHeASwBD7dp8riIP1F5JQGnfGUEjl6iqR_4Bu8bljajlolGRv8utvr_r1rCCNHBAlSnsK5wCZFthnv-nhHtY"/>
<!-- Scanning Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-cyan-400/60 shadow-[0_0_15px_rgba(0,229,255,0.8)] animate-[scan_3s_ease-in-out_infinite]"></div>
<style>
                        @keyframes scan {
                            0%, 100% { transform: translateY(0); }
                            50% { transform: translateY(240px); }
                        }
                    </style>
</div>
<!-- QR Frame Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-cyan-400 rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-cyan-400 rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-cyan-400 rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-cyan-400 rounded-br-lg"></div>
<!-- Mock QR Pattern -->
<div class="w-32 h-32 opacity-20 invert flex flex-col justify-between">
<div class="flex justify-between">
<div class="w-10 h-10 border-4 border-black p-1"><div class="w-full h-full bg-black"></div></div>
<div class="w-10 h-10 border-4 border-black p-1"><div class="w-full h-full bg-black"></div></div>
</div>
<div class="flex justify-between items-end">
<div class="w-10 h-10 border-4 border-black p-1"><div class="w-full h-full bg-black"></div></div>
<div class="w-4 h-4 bg-black"></div>
</div>
</div>
</div>
<p class="font-['Nunito'] text-[12px] text-[#8892A4] mt-6">Point at the QR code on your PC</p>
</div>
<!-- Manual Connection Section -->
<div class="relative z-10 w-full max-w-[340px] mt-8 flex flex-col items-center">
<div class="flex items-center w-full mb-8">
<div class="flex-grow h-[1px] bg-white/10"></div>
<span class="px-4 text-[13px] text-slate-500 font-['Nunito'] tracking-wide">or connect manually</span>
<div class="flex-grow h-[1px] bg-white/10"></div>
</div>
<!-- Input Field -->
<div class="w-full mb-6">
<label class="block text-slate-500 text-[10px] uppercase tracking-widest mb-2 px-2">Enter IP Address</label>
<div class="relative group">
<input class="w-full bg-[#1A2236] border border-[#2A3555] rounded-[14px] px-4 py-3 text-white focus:outline-none focus:ring-1 focus:ring-cyan-400/50 focus:border-cyan-400/60 transition-all placeholder:text-slate-600" placeholder="192.168.1.XX" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400" data-icon="terminal">terminal</span>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-gradient-to-r from-[#00e5ff] to-[#7000ff] rounded-full text-white font-bold tracking-tight shadow-[0_0_15px_rgba(0,229,255,0.3)] hover:shadow-[0_0_25px_rgba(0,229,255,0.5)] transition-all active:scale-[0.98] duration-200">
                Connect via USB
            </button>
<!-- Support Link -->
<a class="mt-8 text-cyan-400 text-[13px] font-semibold hover:text-cyan-300 transition-colors flex items-center gap-1 group" href="#">
                Having trouble? View setup guide
                <span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</a>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-slate-950/40 backdrop-blur-2xl rounded-t-3xl border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-cyan-400 drop-shadow-[0_0_10px_rgba(0,229,255,0.5)] bg-cyan-400/10 rounded-2xl px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="apps">apps</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Apps</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="folder_open">folder_open</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Files</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Settings</span>
</a>
</nav>
</body></html>
