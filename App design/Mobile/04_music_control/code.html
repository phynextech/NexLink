<body class="bg-surface font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Full Screen Blurred Background -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-[#0A0E1A]/70 z-10"></div>
<img class="w-full h-full object-cover blur-3xl scale-110" data-alt="Abstract vibrant digital art with synthwave color palette featuring deep purples and neon cyans in a fluid motion style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuButvkrNBJRkhnTvO3uYZXrmgEapHC7D4B3iZtCcVnGYI9LWCu5rKsN4ebwbCaj_LXHnurW_VsxRwB2VaXRm-RxhL-GtIvmzA19UZICItCL3uJXyJO64ksLe-kZ8wvjuc00iyf7kIEcVV23FblCQbu1Nbck1qaX1KL74OWRqqNsBEkZGItILHqEtwSM8KMTood5bzLZUkHQ7Y0y2lNNTNucSCL3h6rP_n9-KwPjB3LzgnYh4SN145T_ZI6wR7im1Ju3HVx8K2kEGK2G"/>
</div>
<!-- Main Content Canvas -->
<main class="relative z-20 min-h-screen flex flex-col px-margin-safe pt-sm pb-xl max-w-md mx-auto">
<!-- Header: TopAppBar Mapping -->
<header class="flex justify-between items-center py-4 mb-lg">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 backdrop-blur-md border border-white/10 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="text-center">
<h1 class="font-h2 text-body-lg text-on-surface tracking-wide uppercase">Now Playing</h1>
<p class="font-label-sm text-outline-variant tracking-wider">Playing on DESKTOP-XK92</p>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 backdrop-blur-md border border-white/10 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">cast</span>
</button>
</header>
<!-- Album Art Centerpiece -->
<section class="flex-1 flex flex-col items-center justify-center space-y-md">
<div class="relative w-[280px] h-[280px] flex items-center justify-center">
<!-- Decorative Rotating Vinyl Behind -->
<div class="absolute inset-0 vinyl-record rounded-full opacity-40 animate-[spin_10s_linear_infinite] shadow-2xl scale-105"></div>
<!-- Main Glass Card Album Art -->
<div class="relative z-10 w-[260px] h-[260px] rounded-[24px] overflow-hidden border border-white/20 shadow-[0_0_40px_rgba(0,229,255,0.3)] glow-cyan">
<img class="w-full h-full object-cover" data-alt="Abstract colorful music visualization with geometric shapes and neon light streaks in cyan and purple hues" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBBulVGqRm4JvMfKsFQnD3KHDWlAwGKslj7GIZl1cDalkINZYd9z5xjs9w58S1ZBA6-1DsIWxoi7WSwg5_9dEcxD60JEPaRN7fJ93BlN4pwYN78Swj6igzQeTpQh0GeMlH_m2zG60goIpLSqqSOySIrDtl6CMmYvwDgL7nXRD5LyPk2-P0wG_I3Z850URiytGL605y2dLszQXEQK8t68xuxhYa6RGt23yt9OFHIRJmXUmGV_tiNxOsrHkz_bF6knxmkzKARHHRy8-Fu"/>
</div>
</div>
<!-- Track Info -->
<div class="w-full flex items-center justify-between mt-lg">
<div class="space-y-1">
<h2 class="font-h1 text-[24px] text-on-surface leading-tight tracking-tight">Blinding Lights</h2>
<p class="font-body-md text-outline-variant">The Weeknd</p>
</div>
<button class="text-cyan-400 active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
</section>
<!-- Player Controls Section -->
<section class="mt-lg space-y-lg">
<!-- Progress Bar -->
<div class="space-y-base">
<div class="relative w-full h-[6px] bg-[#1A2236] rounded-full overflow-visible">
<div class="absolute left-0 top-0 h-full w-[45%] bg-gradient-to-r from-primary-container to-secondary rounded-full shadow-[0_0_10px_rgba(0,229,255,0.6)]"></div>
<div class="absolute left-[45%] top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white rounded-full shadow-[0_0_12px_rgba(0,229,255,1)]"></div>
</div>
<div class="flex justify-between text-code-data text-outline-variant font-code-data">
<span>1:45</span>
<span>3:20</span>
</div>
</div>
<!-- Playback Controls -->
<div class="flex items-center justify-between px-xs">
<button class="text-on-surface-variant hover:text-cyan-400 transition-colors">
<span class="material-symbols-outlined">shuffle</span>
</button>
<div class="flex items-center space-x-md">
<button class="text-on-surface active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[32px]">skip_previous</span>
</button>
<!-- Primary Play/Pause Button -->
<button class="w-[72px] h-[72px] rounded-full bg-gradient-to-tr from-primary-container to-secondary-container flex items-center justify-center shadow-[0_10px_30px_rgba(0,229,255,0.3)] active:scale-95 transition-all">
<span class="material-symbols-outlined text-surface text-[36px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="text-on-surface active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[32px]">skip_next</span>
</button>
</div>
<button class="text-on-surface-variant hover:text-cyan-400 transition-colors">
<span class="material-symbols-outlined">repeat</span>
</button>
</div>
<!-- Volume Control -->
<div class="flex items-center space-x-md px-base py-4 bg-white/5 backdrop-blur-xl rounded-full border border-white/5">
<span class="material-symbols-outlined text-outline-variant text-[20px]">volume_down</span>
<div class="flex-1 h-[4px] bg-[#1A2236] rounded-full overflow-hidden">
<div class="h-full w-[65%] bg-outline-variant/50 rounded-full"></div>
</div>
<span class="material-symbols-outlined text-outline-variant text-[20px]">volume_up</span>
</div>
</section>
<!-- Bottom Navigation Spacer -->
<div class="h-xl"></div>
</main>
<!-- BottomNavBar Mapping from JSON -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-slate-950/40 backdrop-blur-2xl rounded-t-3xl border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Files</span>
</a>
<!-- Active Mapping: Media -->
<a class="flex flex-col items-center justify-center text-cyan-400 drop-shadow-[0_0_10px_rgba(0,229,255,0.5)] bg-cyan-400/10 rounded-2xl px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="play_circle" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Media</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="apps">apps</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Apps</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 px-4 py-2 hover:bg-white/5 transition-all active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium tracking-widest uppercase">Settings</span>
</a>
</nav>
